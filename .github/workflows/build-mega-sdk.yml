name: Build vendored MEGA SDK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cloud-sync-schedule-presets-notifications
    paths:
      - .github/workflows/build-mega-sdk.yml
      - .github/scripts/build-mega-sdk-aar.sh

permissions:
  contents: write

concurrency:
  group: build-mega-sdk-${{ github.ref }}
  cancel-in-progress: false

env:
  MEGA_SDK_TAG: v10.19.0
  ANDROID_NDK_VERSION: 27.1.12297006
  MEGA_ANDROID_API: '28'

jobs:
  build-mega-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-sync-schedule-presets-notifications
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: mega-vcpkg-${{ runner.os }}-${{ env.MEGA_SDK_TAG }}-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autoconf-archive binutils build-essential \
            make ninja-build pkg-config swig unzip

          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${ANDROID_NDK_VERSION}"
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$SDKMANAGER_STATUS" -ne 0 ]]; then
            echo "::error::sdkmanager failed with status ${SDKMANAGER_STATUS}"
            exit "$SDKMANAGER_STATUS"
          fi
          test -d "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"

      - name: Build and verify MEGA Android AAR
        shell: bash
        run: |
          chmod +x .github/scripts/build-mega-sdk-aar.sh
          .github/scripts/build-mega-sdk-aar.sh

      - name: Validate application with vendored MEGA SDK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Override the developer-specific JDK in gradle.properties here too.
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" \
            :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify Android 8 compatibility policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'minSdk = 26' app/build.gradle.kts
          grep -Fq 'Build.VERSION.SDK_INT < Build.VERSION_CODES.P' \
            app/src/main/java/jp/linkserver/nittcsc/sync/CloudFileSyncManager.kt
          grep -Fq 'MEGA同期はAndroid 9以降で利用できます' \
            app/src/main/java/jp/linkserver/nittcsc/sync/CloudFileSyncManager.kt

      - name: Commit vendored SDK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/libs/mega-sdk.aar third_party/mega-sdk-LICENSE.txt
          if git diff --cached --quiet; then
            echo "Vendored SDK already up to date"
            exit 0
          fi
          git commit -m "build: vendor MEGA SDK ${MEGA_SDK_TAG} Android AAR"

          # The native/Gradle build may touch tracked workspace files. The vendored
          # artifacts are already committed above, so reset every remaining tracked
          # change before rebasing. This prevents an unrelated dirty worktree from
          # making `git pull --rebase` fail while preserving the artifact commit.
          git status --short
          git reset --hard HEAD
          git status --short

          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
