name: Apply NITTC customization

on:
  push:
    branches:
      - feature/cloud-sync-schedule-presets-notifications
    paths:
      - scripts/apply_customization.py
      - .github/workflows/apply-customization.yml

permissions:
  contents: write

jobs:
  customize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-sync-schedule-presets-notifications
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source transformation
        run: |
          python3 scripts/apply_customization.py
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'compatibility fix pattern missing: {path}: {old}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          edit(
              'app/src/main/java/jp/linkserver/nittcsc/reminder/AdditionalLessonNotificationWorker.kt',
              '        suspend fun findNextLesson(\n',
              '        internal suspend fun findNextLesson(\n'
          )
          edit(
              'app/src/main/java/jp/linkserver/nittcsc/sync/CloudFileSyncManager.kt',
              'object : InvalidationTracker.Observer(*watchedTables) {',
              'object : InvalidationTracker.Observer(watchedTables) {'
          )
          edit(
              'app/src/main/java/jp/linkserver/nittcsc/data/SchedulerRepository.kt',
              'useKosenMode = preset.periodLabelStyle != PeriodLabelStyle.SINGLE_KOSHI,',
              'useKosenMode = preset.periodLabelStyle == PeriodLabelStyle.PAIR_KOSHI,'
          )
          edit(
              'app/src/main/java/jp/linkserver/nittcsc/viewmodel/SchedulerViewModel.kt',
              '            5 -> "金"\n            else -> ""',
              '            5 -> "金"\n            6 -> "土"\n            else -> ""'
          )
          PY
      - name: Prepare Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Commit generated changes
        run: |
          if git diff --quiet -- app README.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md
          git commit -m "feat: add cloud sync, schedule presets, notification customization and Saturday classes"
          git push origin HEAD:feature/cloud-sync-schedule-presets-notifications
