name: Apply NITTC customization

on:
  push:
    branches:
      - feature/cloud-sync-schedule-presets-notifications
    paths:
      - scripts/apply_customization.py
      - .github/workflows/apply-customization.yml

permissions:
  contents: write

jobs:
  customize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-sync-schedule-presets-notifications
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source transformation
        run: python3 scripts/apply_customization.py
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Commit generated changes
        run: |
          if git diff --quiet -- app README.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md
          git commit -m "feat: add cloud sync, schedule presets, notification customization and Saturday classes"
          git push origin HEAD:feature/cloud-sync-schedule-presets-notifications
