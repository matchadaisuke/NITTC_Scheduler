name: Apply MEGA sync wiring

on:
  push:
    branches:
      - feature/cloud-sync-schedule-presets-notifications
    paths:
      - scripts/apply_mega_sync.py
      - .github/workflows/apply-mega-sync.yml

permissions:
  contents: write

jobs:
  apply-mega-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-sync-schedule-presets-notifications
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply MEGA source wiring
        run: python3 scripts/apply_mega_sync.py
      - name: Prepare Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Commit generated changes
        run: |
          if git diff --quiet -- app README.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md
          git commit -m "feat: switch cloud sync UI to standalone MEGA login"
          git push origin HEAD:feature/cloud-sync-schedule-presets-notifications
