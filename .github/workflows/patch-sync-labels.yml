name: Patch sync labels

on:
  push:
    branches:
      - feature/cloud-sync-schedule-presets-notifications
    paths:
      - scripts/patch_sync_labels.py
      - .github/workflows/patch-sync-labels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-sync-schedule-presets-notifications
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply sync label patch
        run: python3 scripts/patch_sync_labels.py
      - name: Prepare Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Commit patch
        run: |
          git restore gradlew gradle.properties
          if git diff --quiet -- app; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "ui: finish MEGA primary sync labels"
          git pull --rebase origin feature/cloud-sync-schedule-presets-notifications
          git push origin HEAD:feature/cloud-sync-schedule-presets-notifications
