name: Patch MEGA transfer compatibility

on:
  push:
    branches:
      - feature/cloud-sync-schedule-presets-notifications
    paths:
      - .github/workflows/patch-mega-transfer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-sync-schedule-presets-notifications
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch official MEGA v10.19 transfer overloads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/jp/linkserver/nittcsc/sync/CloudFileSyncManager.kt')
          s = p.read_text(encoding='utf-8')
          old_upload = 'transfer("startUpload", file.absolutePath, parent, fileName).requireOk("アップロード")'
          new_upload = 'transfer("startUpload", file.absolutePath, parent, fileName, -1L, null, false, false, null).requireOk("アップロード")'
          old_download = 'transfer("startDownload", node, destination.absolutePath).requireOk("ダウンロード")'
          new_download = 'transfer("startDownload", node, destination.absolutePath, null, null, false, null, 5, 1).requireOk("ダウンロード")'
          if old_upload in s:
              s = s.replace(old_upload, new_upload, 1)
          elif new_upload not in s:
              raise SystemExit('startUpload pattern not found')
          if old_download in s:
              s = s.replace(old_download, new_download, 1)
          elif new_download not in s:
              raise SystemExit('startDownload pattern not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Prepare Gradle wrapper
        run: |
          chmod +x gradlew
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
      - name: Compile and test
        run: |
          ./gradlew :app:compileDebugKotlin
          ./gradlew :app:testDebugUnitTest
      - name: Commit compatibility fix
        run: |
          if git diff --quiet -- app/src/main/java/jp/linkserver/nittcsc/sync/CloudFileSyncManager.kt; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/linkserver/nittcsc/sync/CloudFileSyncManager.kt
          git commit -m "fix: use MEGA v10.19 transfer overloads"
          git restore gradlew gradle.properties
          git pull --rebase origin feature/cloud-sync-schedule-presets-notifications
          git push origin HEAD:feature/cloud-sync-schedule-presets-notifications
